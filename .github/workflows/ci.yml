name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      # The PR's commits, or the pushed ones. After a force push the old tip is
      # gone, so only the last commit is linted.
      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            npx --no -- commitlint --from "$FROM" --to "$TO" --verbose
          else
            npx --no -- commitlint --last --verbose
          fi

      - run: npm run typecheck
      - run: npm run check:tracker-refs
      - run: npm test
      # The visual baselines were drawn with Noto Sans as system-ui. Without
      # it Ubuntu picks WenQuanYi Zen Hei and every baseline fails.
      - run: |
          npx playwright install --with-deps --only-shell chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-core
      - run: npm run test:e2e

  # The KDE companion on each supported target, in the pinned images of
  # desktop/kde/ci: CTest (desktop/core's tests included), the DEB or RPM
  # with installation, loading, upgrade and removal checks, then the
  # real-server test. The version is the one in package.json; the release
  # job builds its own packages.
  kde:
    name: kde (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: TUXEDO OS 24.04
            format: deb
          - target: Fedora KDE 44
            format: rpm
    env:
      FORMAT: ${{ matrix.format }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test, package and check
        env:
          OUTPUT: ${{ runner.temp }}/kde
        run: |
          version="$(node -p 'require("./package.json").version')"
          desktop/kde/scripts/container-check.sh --version "$version" --format "$FORMAT" --output "$OUTPUT"
      - name: Real-server test
        env:
          OUTPUT: ${{ runner.temp }}/kde
        run: desktop/kde/ci/realserver.sh --format "$FORMAT" --output "$OUTPUT"

  # desktop/core on its own in a pinned Fedora 44 container with only the
  # Qt base development packages and no Qt Gui runtime, so a Gui or KDE
  # dependency in the shared core fails here.
  core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: desktop/core/ci/check.sh

  # desktop/gnome (tokkl-timerd on desktop/core) in a pinned Fedora 44
  # container with QtKeychain and GNOME Keyring and no Qt Gui runtime: CTest,
  # the Qt libraries the service loads, its installed files, and D-Bus
  # activation of the installed service with and without systemd.
  gnome:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: desktop/gnome/ci/check.sh

  # desktop/gnome/extension/ci/check.sh: the GNOME Shell extension in a
  # headless GNOME Shell against a stand-in for tokkl-timerd, in a pinned
  # container of a distribution that ships that Shell. One leg per Shell
  # version, as each takes a few minutes. The first step fails when the
  # matrix and the shell-version list of metadata.json differ.
  gnome-extension:
    name: gnome-extension (Shell ${{ matrix.shell }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shell: ['46', '47', '48', '49', '50', '51']
    env:
      VERSION: ${{ matrix.shell }}
      LEGS: ${{ strategy.job-total }}
      METADATA: desktop/gnome/extension/metadata.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the matrix against metadata.json
        run: |
          listed="$(jq '."shell-version" | length' "$METADATA")"
          if [ "$LEGS" != "$listed" ]; then
            echo "::error::the matrix has $LEGS Shell versions and $METADATA lists $listed"
            exit 1
          fi
          if ! jq -e --arg version "$VERSION" 'any(."shell-version"[]; . == $version)' "$METADATA" > /dev/null; then
            echo "::error::$METADATA does not list GNOME Shell $VERSION"
            exit 1
          fi
      - run: desktop/gnome/extension/ci/check.sh "$VERSION"

  # The macOS menu bar app on a pinned Qt from the Qt installer and a pinned
  # QtKeychain built against it: build Tokkl.app, run CTest (desktop/core's
  # tests included), check the bundle's Info.plist, and start the app once
  # to see that it stays up. The release waits for it but ships no macOS app.
  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      QT_VERSION: 6.11.3
      QTKEYCHAIN_VERSION: 0.17.0
      QTKEYCHAIN_COMMIT: 875f77d9f61bd97fd84cca47ce3bc71186dfbd09
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sets QT_ROOT_DIR and puts the pinned Qt's tools on PATH.
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Build QtKeychain
        env:
          SRC: ${{ runner.temp }}/qtkeychain-src
          PREFIX: ${{ runner.temp }}/qtkeychain
        run: |
          git clone --quiet --depth 1 --branch "$QTKEYCHAIN_VERSION" https://github.com/frankosterfeld/qtkeychain.git "$SRC"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$QTKEYCHAIN_COMMIT"
          cmake -S "$SRC" -B "$SRC/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DBUILD_TRANSLATIONS=OFF -DBUILD_TESTING=OFF
          cmake --build "$SRC/build" -j"$(sysctl -n hw.ncpu)"
          cmake --install "$SRC/build"
      - name: Build
        env:
          BUILD: ${{ runner.temp }}/macos
          QTKEYCHAIN: ${{ runner.temp }}/qtkeychain
        run: |
          cmake -S desktop/macos -B "$BUILD" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$QTKEYCHAIN"
          # The pinned Qt, not another one on the runner.
          qt_dir=$(sed -n 's/^Qt6_DIR:[A-Z]*=//p' "$BUILD/CMakeCache.txt")
          case "$qt_dir" in
            "$QT_ROOT_DIR"/*) ;;
            *) echo "Qt6_DIR is '$qt_dir', not under $QT_ROOT_DIR" >&2; exit 1 ;;
          esac
          cmake --build "$BUILD" -j"$(sysctl -n hw.ncpu)"
      - name: Test
        env:
          BUILD: ${{ runner.temp }}/macos
        run: ctest --test-dir "$BUILD" --output-on-failure
      - name: Check the bundle
        env:
          BUILD: ${{ runner.temp }}/macos
        run: |
          app="$BUILD/src/Tokkl.app"
          plutil -lint "$app/Contents/Info.plist"
          test "$(plutil -extract LSUIElement raw "$app/Contents/Info.plist")" = true
          codesign --verify --verbose "$app"
          # Starts with no settings, so it opens its settings window and
          # touches no keychain item. It must still be running after a while.
          "$app/Contents/MacOS/Tokkl" &
          pid=$!
          sleep 10
          kill -0 "$pid"
          kill "$pid"

  release:
    needs: [test, kde, core, gnome, gnome-extension, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      # Bumps the version, builds and checks the KDE packages for it
      # (desktop/kde/ci/semantic-release.js), commits CHANGELOG.md and
      # package.json, tags v<version> and creates the GitHub release with the
      # DEB and RPM attached, or does nothing when the pushed commits warrant
      # no release.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no -- semantic-release

      # A new release leaves its tag on HEAD.
      - id: tag
        run: echo "tag=$(git tag --points-at HEAD 'v*')" >> "$GITHUB_OUTPUT"

      # No QEMU: npm and Vite run on the build platform and the runtime stage
      # only copies files.
      - if: steps.tag.outputs.tag
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.tag.outputs.tag
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ghcr.io/e0ipso/tokkl
        if: steps.tag.outputs.tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version=${TAG#v}
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            -t "$image:$version" -t "$image:${version%.*}" -t "$image:${version%%.*}" -t "$image:latest" .
