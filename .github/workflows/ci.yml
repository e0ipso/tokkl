name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      # The PR's commits, or the pushed ones. After a force push the old tip is
      # gone, so only the last commit is linted.
      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            npx --no -- commitlint --from "$FROM" --to "$TO" --verbose
          else
            npx --no -- commitlint --last --verbose
          fi

      - run: npm run typecheck
      - run: npm run check:tracker-refs
      - run: npm test
      # The visual baselines were drawn with Noto Sans as system-ui. Without
      # it Ubuntu picks WenQuanYi Zen Hei and every baseline fails.
      - run: |
          npx playwright install --with-deps --only-shell chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-core
      - run: npm run test:e2e

  # The KDE companion on each supported target, in the pinned images of
  # desktop/kde/ci: CTest (desktop/core's tests included), the DEB or RPM
  # with installation, loading, upgrade and removal checks, then the
  # real-server test. The version is the one in package.json; the
  # kde-release jobs build the release packages. The dependency images (target, build and
  # test) come from the Actions cache when one holds them for the current
  # inputs (desktop/kde/ci/image-id.sh) and are saved there after a build.
  # TOKKL_KDE_CI_REFRESH is the ISO week of the commit, so the images are
  # rebuilt against the moving distribution archives at least once a week.
  # Caches saved by a pull request are visible to that pull request only;
  # the release jobs read the ones saved on main.
  kde:
    name: kde (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Debian 13
            format: deb
          - target: Kubuntu 26.04
            format: ubuntu-deb
          - target: Fedora KDE 44
            format: rpm
    env:
      FORMAT: ${{ matrix.format }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Identify the dependency images
        id: images
        run: |
          refresh="$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%G-W%V)"
          echo "TOKKL_KDE_CI_REFRESH=$refresh" >> "$GITHUB_ENV"
          echo "id=$(TOKKL_KDE_CI_REFRESH="$refresh" desktop/kde/ci/image-id.sh --format "$FORMAT")" >> "$GITHUB_OUTPUT"
      - id: restore-images
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/kde-images/${{ matrix.format }}-${{ steps.images.outputs.id }}.tar
          key: kde-images-${{ matrix.format }}-${{ steps.images.outputs.id }}
      - name: Test, package and check
        env:
          OUTPUT: ${{ runner.temp }}/kde
          TOKKL_KDE_CI_IMAGE_CACHE: ${{ runner.temp }}/kde-images
        run: |
          version="$(node -p 'require("./package.json").version')"
          desktop/kde/scripts/container-check.sh --version "$version" --format "$FORMAT" --output "$OUTPUT"
      - if: steps.restore-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kde-images/${{ matrix.format }}-${{ steps.images.outputs.id }}.tar
          key: kde-images-${{ matrix.format }}-${{ steps.images.outputs.id }}
      - name: Real-server test
        env:
          OUTPUT: ${{ runner.temp }}/kde
        run: desktop/kde/ci/realserver.sh --format "$FORMAT" --output "$OUTPUT"

  # desktop/core on its own in a pinned Fedora 44 container with only the
  # Qt base development packages and no Qt Gui runtime, so a Gui or KDE
  # dependency in the shared core fails here.
  core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: desktop/core/ci/check.sh

  # desktop/gnome (tokkl-timerd on desktop/core) in a pinned Fedora 44
  # container with QtKeychain and GNOME Keyring and no Qt Gui runtime: CTest,
  # the Qt libraries the service loads, its installed files, and D-Bus
  # activation of the installed service with and without systemd. Then the
  # release files for the version in package.json: the tokkl-timerd DEB
  # (Debian 13) and RPM (Fedora 44), each installed on a clean target and
  # activated on the session bus, and the extension zip. gnome-release builds
  # them for the release the same way.
  gnome:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: desktop/gnome/ci/check.sh
      - name: Package and check
        env:
          OUTPUT: ${{ runner.temp }}/gnome
        run: desktop/gnome/scripts/container-check.sh --version "$(jq -r .version package.json)" --output "$OUTPUT"

  # desktop/gnome/extension/ci/check.sh: the GNOME Shell extension in a
  # headless GNOME Shell against a stand-in for tokkl-timerd, in a pinned
  # container of a distribution that ships that Shell. One leg per Shell
  # version, as each takes a few minutes. The first step fails when the
  # matrix and the shell-version list of metadata.json differ.
  gnome-extension:
    name: gnome-extension (Shell ${{ matrix.shell }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shell: ['46', '47', '48', '49', '50', '51']
    env:
      VERSION: ${{ matrix.shell }}
      LEGS: ${{ strategy.job-total }}
      METADATA: desktop/gnome/extension/metadata.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the matrix against metadata.json
        run: |
          listed="$(jq '."shell-version" | length' "$METADATA")"
          if [ "$LEGS" != "$listed" ]; then
            echo "::error::the matrix has $LEGS Shell versions and $METADATA lists $listed"
            exit 1
          fi
          if ! jq -e --arg version "$VERSION" 'any(."shell-version"[]; . == $version)' "$METADATA" > /dev/null; then
            echo "::error::$METADATA does not list GNOME Shell $VERSION"
            exit 1
          fi
      - run: desktop/gnome/extension/ci/check.sh "$VERSION"

  # The macOS menu bar app on a pinned Qt from the Qt installer and a pinned
  # QtKeychain built against it (.github/actions/macos-build): build
  # Tokkl.app for the version in package.json, run CTest (desktop/core's tests
  # included), then package it as a DMG and check the DMG, starting the app
  # from it once to see that it stays up. macos-release packages the release
  # the same way.
  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: build
        uses: ./.github/actions/macos-build
      - name: Test
        env:
          BUILD: ${{ steps.build.outputs.build-dir }}
        run: ctest --test-dir "$BUILD" --output-on-failure
      - name: Package and check the DMG
        env:
          APP: ${{ steps.build.outputs.app }}
          QTKEYCHAIN: ${{ steps.build.outputs.qtkeychain }}
          OUTPUT: ${{ runner.temp }}/dmg
        run: |
          version="$(jq -r .version package.json)"
          dmg="$(MACDEPLOYQT="$QT_ROOT_DIR/bin/macdeployqt" desktop/macos/scripts/package-dmg.sh \
            --app "$APP" --version "$version" --output "$OUTPUT" --libpath "$QTKEYCHAIN/lib")"
          desktop/macos/scripts/check-dmg.sh "$dmg" "$version"

  # The release runs in three stages once every check has passed. This job
  # works out the version the pushed commits release with a semantic-release
  # dry run (desktop/kde/ci/next-release.js), or nothing when they warrant no
  # release, and records the commit it was worked out for.
  release-version:
    needs: [test, kde, core, gnome, gnome-extension, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The dry run still checks that semantic-release could push.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Work out the next version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node desktop/kde/ci/next-release.js)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The tokkl-kde Debian and Ubuntu DEBs and RPM for that version and commit, each on its own
  # runner, tested, built and checked by desktop/kde/scripts/container-check.sh
  # as in the kde job. The dependency images come from the cache the kde job
  # saved on main; the release never saves images. Each leg uploads its
  # package with a manifest (format, version, revision, file, SHA-256) as
  # kde-release-<format>. A re-run replaces the artifact.
  kde-release:
    name: kde-release (${{ matrix.target }})
    needs: release-version
    if: needs.release-version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Debian 13
            format: deb
          - target: Kubuntu 26.04
            format: ubuntu-deb
          - target: Fedora KDE 44
            format: rpm
    env:
      FORMAT: ${{ matrix.format }}
      VERSION: ${{ needs.release-version.outputs.version }}
      REVISION: ${{ needs.release-version.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-version.outputs.revision }}
          persist-credentials: false
      - name: Identify the dependency images
        id: images
        run: |
          refresh="$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%G-W%V)"
          echo "TOKKL_KDE_CI_REFRESH=$refresh" >> "$GITHUB_ENV"
          echo "id=$(TOKKL_KDE_CI_REFRESH="$refresh" desktop/kde/ci/image-id.sh --format "$FORMAT")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/kde-images/${{ matrix.format }}-${{ steps.images.outputs.id }}.tar
          key: kde-images-${{ matrix.format }}-${{ steps.images.outputs.id }}
      # The newest published release older than VERSION with a package for
      # this target, checked against its digest, for the upgrade check
      # (desktop/kde/ci/previous-package.sh). Without one, or when it cannot
      # be downloaded, the step says why and the check builds this source as
      # 0.0.0 instead; a download that does not match its size and digest
      # fails the leg, as does a package check-package.sh refuses.
      - name: Fetch the previous package
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIR: ${{ runner.temp }}/previous
        run: |
          file="$(desktop/kde/ci/previous-package.sh --format "$FORMAT" --version "$VERSION" --output "$DIR")"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Test, package and check
        env:
          OUTPUT: ${{ runner.temp }}/kde
          TOKKL_KDE_CI_IMAGE_CACHE: ${{ runner.temp }}/kde-images
          PREVIOUS: ${{ steps.previous.outputs.file }}
        run: |
          previous=()
          [ -z "$PREVIOUS" ] || previous=(--previous-package "$PREVIOUS")
          desktop/kde/scripts/container-check.sh --version "$VERSION" --format "$FORMAT" --output "$OUTPUT" "${previous[@]}"
      - name: Record the package
        env:
          OUTPUT: ${{ runner.temp }}/kde
          DIR: ${{ runner.temp }}/kde-release
        run: |
          if [ "$(git rev-parse HEAD)" != "$REVISION" ]; then
            echo "::error::checked out $(git rev-parse HEAD), expected $REVISION"
            exit 1
          fi
          native="$(desktop/kde/scripts/native-version.sh "$VERSION")"
          shopt -s nullglob
          if [ "$FORMAT" = deb ]; then
            packages=("$OUTPUT/tokkl-kde_${native}_amd64.deb")
          elif [ "$FORMAT" = ubuntu-deb ]; then
            packages=("$OUTPUT/tokkl-kde_${native}_amd64-ubuntu26.04.deb")
          else
            packages=("$OUTPUT/tokkl-kde-${native}-1."*.x86_64.rpm)
          fi
          if [ "${#packages[@]}" != 1 ] || [ ! -f "${packages[0]}" ]; then
            echo "::error::expected one tokkl-kde $FORMAT for $native in $OUTPUT"
            ls -l "$OUTPUT"
            exit 1
          fi
          mkdir -p "$DIR"
          cp "${packages[0]}" "$DIR/"
          name="$(basename "${packages[0]}")"
          jq -n --arg format "$FORMAT" --arg version "$VERSION" --arg revision "$REVISION" \
            --arg package "$name" --arg sha256 "$(sha256sum "$DIR/$name" | cut -d' ' -f1)" \
            '{format: $format, version: $version, revision: $revision, package: $package, sha256: $sha256}' \
            > "$DIR/kde-$FORMAT.json"
          cat "$DIR/kde-$FORMAT.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kde-release-${{ matrix.format }}
          path: ${{ runner.temp }}/kde-release/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The final gate: it runs only when all three kde-release legs passed, with
  # their packages in dist/kde, on the same commit (github.sha). The plugin
  # checks each manifest against that commit.
  release:
    needs: [test, kde, core, gnome, gnome-extension, macos, release-version, kde-release]
    if: github.event_name == 'push' && needs.release-version.outputs.version != ''
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kde-release-*
          merge-multiple: true
          path: dist/kde

      # Bumps the version, checks that dist/kde holds exactly the Debian and Ubuntu DEBs and RPM
      # built for it from this commit (desktop/kde/ci/semantic-release.js),
      # commits CHANGELOG.md and package.json, tags v<version> and creates the
      # GitHub release with both DEBs and the RPM attached. The plugin fails, before
      # anything is pushed, when the next version is not the one the packages
      # were built for; when another release has moved main on in the
      # meantime, semantic-release releases nothing. The macos-release and
      # macos-publish jobs add the DMG, and gnome-release and gnome-publish
      # the tokkl-timerd DEB and RPM and the GNOME Shell extension zip.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKKL_KDE_RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        run: npx --no -- semantic-release

      # A new release leaves its tag on HEAD.
      - id: tag
        run: echo "tag=$(git tag --points-at HEAD 'v*')" >> "$GITHUB_OUTPUT"

      # No QEMU: npm and Vite run on the build platform and the runtime stage
      # only copies files.
      - if: steps.tag.outputs.tag
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.tag.outputs.tag
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ghcr.io/e0ipso/tokkl
        if: steps.tag.outputs.tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version=${TAG#v}
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            -t "$image:$version" -t "$image:${version%.*}" -t "$image:${version%%.*}" -t "$image:latest" .

  # The DMG for the release the release job just made. semantic-release
  # decides the version on the Linux release runner, and the app builds only
  # on macOS, so this job runs afterwards: it builds Tokkl.app from the
  # v<version> tag with that version, packages and checks it as the macos job
  # does, and hands the DMG to macos-publish. The release is public without
  # the DMG until macos-publish attaches it. Re-running a failed job attaches
  # it to the existing release.
  macos-release:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      # The tag's package.json holds the version semantic-release wrote.
      - name: Check the version
        run: |
          version=${TAG#v}
          if [ "$(jq -r .version package.json)" != "$version" ]; then
            echo "::error::package.json at $TAG does not have version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - id: build
        uses: ./.github/actions/macos-build
        with:
          version: ${{ env.VERSION }}
          build-type: Release
      - name: Package and check the DMG
        env:
          APP: ${{ steps.build.outputs.app }}
          QTKEYCHAIN: ${{ steps.build.outputs.qtkeychain }}
          OUTPUT: ${{ runner.temp }}/dmg
        run: |
          dmg="$(MACDEPLOYQT="$QT_ROOT_DIR/bin/macdeployqt" desktop/macos/scripts/package-dmg.sh \
            --app "$APP" --version "$VERSION" --output "$OUTPUT" --libpath "$QTKEYCHAIN/lib")"
          test "$dmg" = "$OUTPUT/Tokkl-$VERSION-arm64.dmg"
          desktop/macos/scripts/check-dmg.sh "$dmg" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg
          path: ${{ runner.temp }}/dmg/Tokkl-${{ env.VERSION }}-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  # Attaches the DMG to the v<version> release. Kept apart from macos-release
  # so the job that builds third-party code holds no write token.
  macos-publish:
    needs: [release, macos-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-dmg
          path: ${{ runner.temp }}/dmg
      - name: Attach the DMG to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIR: ${{ runner.temp }}/dmg
        run: |
          dmg="$DIR/Tokkl-${TAG#v}-arm64.dmg"
          test -f "$dmg"
          gh release upload "$TAG" "$dmg#Tokkl for macOS 13 or later (Apple silicon)" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # The tokkl-timerd DEB and RPM and the GNOME Shell extension zip for the
  # release the release job just made, built from the v<version> tag with
  # that version and checked as the gnome job checks them. They go to
  # gnome-publish, which attaches them. The release is public without them
  # until then. Re-running a failed job attaches them to the existing
  # release. extensions.gnome.org is not part of the release: its upload and
  # review are manual (desktop/gnome/README.md).
  gnome-release:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      # The tag's package.json holds the version semantic-release wrote.
      - name: Check the version
        run: |
          version=${TAG#v}
          if [ "$(jq -r .version package.json)" != "$version" ]; then
            echo "::error::package.json at $TAG does not have version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Package and check
        env:
          OUTPUT: ${{ runner.temp }}/gnome
        run: desktop/gnome/scripts/container-check.sh --version "$VERSION" --output "$OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gnome-release
          path: |
            ${{ runner.temp }}/gnome/tokkl-timerd_*_amd64.deb
            ${{ runner.temp }}/gnome/tokkl-timerd-*.x86_64.rpm
            ${{ runner.temp }}/gnome/tokkl-gnome-extension-${{ env.VERSION }}.zip
          if-no-files-found: error
          retention-days: 7

  # Attaches the GNOME files to the v<version> release. Kept apart from
  # gnome-release so the job that builds third-party code holds no write
  # token.
  gnome-publish:
    needs: [release, gnome-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gnome-release
          path: ${{ runner.temp }}/gnome
      - name: Attach the GNOME files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIR: ${{ runner.temp }}/gnome
        run: |
          version=${TAG#v}
          shopt -s nullglob
          debs=("$DIR"/tokkl-timerd_*_amd64.deb)
          rpms=("$DIR"/tokkl-timerd-*.x86_64.rpm)
          zip="$DIR/tokkl-gnome-extension-$version.zip"
          if [ "${#debs[@]}" != 1 ] || [ "${#rpms[@]}" != 1 ] || [ ! -f "$zip" ]; then
            echo "::error::expected one DEB, one RPM and $zip in $DIR"
            ls -l "$DIR"
            exit 1
          fi
          gh release upload "$TAG" \
            "${debs[0]}#tokkl-timerd DEB for Debian 13 (amd64)" \
            "${rpms[0]}#tokkl-timerd RPM for Fedora 44 (x86_64)" \
            "$zip#Tokkl GNOME Shell extension (GNOME Shell 46 to 51)" \
            --repo "$GITHUB_REPOSITORY" --clobber
