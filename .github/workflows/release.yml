name: Release
on:
  push:
    branches: [main]

# Nothing is granted at the workflow level; each job asks for what it needs.
permissions: {}

# Two releases computed from the same tags at once would race for the next
# version. Queue them instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Read-only verification. Dependency installation, the tests and the Docker
  # build all run here with a read-only token and no secrets, so a compromised
  # package script cannot reach anything that could tag, push or publish.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint walks the pushed range, so the whole history is needed.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Lifecycle scripts are skipped. On Linux the only one in the tree is
      # the root `prepare` (husky), which CI does not need.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The PR checks lint each PR's commits, but a squash or merge commit is
      # written on merge, and a direct push skips PRs entirely. `before` is all
      # zeros when the branch is created, and missing after a force push; then
      # only the last commit is linted. Commits older than this workflow are
      # never linted.
      - name: Lint the pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            npx --no -- commitlint --from "$BEFORE" --to "$AFTER" --verbose
          else
            npx --no -- commitlint --last --verbose
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The visual baselines are tied to the headless shell this Playwright
      # version installs, so install exactly that, plus its system libraries.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # The body font is system-ui, and the baselines were drawn with Noto
      # Sans. Without it, a bare Ubuntu 24.04 picks WenQuanYi Zen Hei and all
      # 20 baselines fail.
      - name: Install Noto fonts
        run: sudo apt-get install -y --no-install-recommends fonts-noto-core

      - name: E2E
        run: npm run test:e2e

      - name: Docker build
        run: docker build -t tokkl:ci .

      - name: Docker smoke test
        run: scripts/docker-smoke.sh tokkl:ci

  # Versioning. Runs only after verify passed on the same commit, with the
  # permissions semantic-release needs and nothing else:
  #   contents: write        release commit, tag and GitHub release
  #   issues/pull-requests   @semantic-release/github success/fail comments
  # Nothing is published to npm: package.json is private and
  # .releaserc.json sets npmPublish to false.
  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      # Empty when the pushed commits warrant no release.
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release needs the full history and tags to compute the
          # next version.
          fetch-depth: 0
          # The token is not written into .git/config. semantic-release pushes
          # the release commit and tag over https with the GITHUB_TOKEN passed
          # to its own step, so the install step never sees it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The only step that holds a write token. semantic-release bumps the
      # root version, commits CHANGELOG.md, package.json and
      # package-lock.json with [skip ci], tags v<version> and creates the
      # GitHub release. @semantic-release/exec writes version=<version> to
      # $GITHUB_OUTPUT for the image job, because a tag pushed with
      # GITHUB_TOKEN does not start other workflows. HUSKY=0 keeps the local
      # commit hooks out of the release commit.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: npx --no -- semantic-release

  # Publication to ghcr.io/<owner>/tokkl. Builds from the release tag, so the
  # image holds the bumped package.json, and pushes <version>,
  # <major>.<minor>, <major> and latest.
  image:
    name: Container image
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      # No QEMU: the Dockerfile runs npm and Vite on the build platform, and
      # the runtime stage only copies files, so arm64 builds without
      # emulation. A RUN added to the runtime stage fails the arm64 build
      # with "exec format error"; add docker/setup-qemu-action then.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # context: git reads the revision from the checked-out tag, not from
      # the commit that triggered the workflow.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
