version: 2
# The prefixes are commitlint types; build and ci cut no release.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: build }
    ignore:
      # The lockfile lists the workspaces as packages/*; they are not on the registry.
      - dependency-name: "packages/*"
      # Majors (TypeScript, @types/node past the Node 24 runtime) are deliberate upgrades.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: ci }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: build }
