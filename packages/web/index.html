<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The light and dark --bg from packages/web/src/styles.css. packages/web/src/lib/theme.ts
         copies one into both when an explicit Theme preference overrides the system. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4e7cf" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1026" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Blocking on purpose: sets the cached data-theme before the first paint. Keep it above the bundle and stylesheet. -->
    <script src="/theme-boot.js"></script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preload" href="/fonts/anybody-wdth-wght.woff2" as="font" type="font/woff2" crossorigin />
    <title>Tokkl</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
