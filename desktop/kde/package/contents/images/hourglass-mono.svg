<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- The Pomodoro mode glyph in one colour, black on transparent. Plasma
       tints it as a mask, GNOME Shell recolours it as a symbolic icon (only
       rect and path elements) and macOS draws it as a template image. -->
